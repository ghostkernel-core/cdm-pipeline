name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # the CI token can only read the repository
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Run tests with coverage (at least 95%)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=95

      - name: Run the pipeline
        run: python -m src.main

      - name: Check that the committed output is up to date
        run: git diff --exit-code cdm_lakehouse quarantine logs/pipeline-run.log logs/pipeline-warnings.log

      - name: Keep the log and the rejected rows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-output-py${{ matrix.python-version }}
          path: |
            logs/
            quarantine/
